{% extends 'base.html' %}

{% block title %}Войти{% endblock %}

{% block content %}

<div style="display: flex; flex: 1;">
    <div style="flex: 0.625; display: flex; align-items: center; background-color: #e6e6e6; justify-content: center;">
        <img src="/media/logos/login.png">
    </div>
    <div style="flex: 0.375; display: flex; flex-direction: column;">
        <h1 style="text-align: center; margin-top: 5px;"><b>Вход в аккаунт</b></h1>
        <div style="flex: 1.5"></div>
        <form method="post" style="width: 60%; align-self: center;">
            {% csrf_token %}

            <div class="form-row">
                {{ form.login.label_tag }}
                {{ form.login }}
                {{ form.login.errors }}
            </div>

            <div class="form-row">
                {{ form.password.label_tag }}
                {{ form.password }}
                {{ form.password.errors }}
            </div>
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button type="submit" class="btn btn-primary">Войти</button>
                <a class="btn btn-secondary" href="/register">Зарегистрироваться</a>
            </div>
        </form>
        <div style="flex: 0.5"></div>
    </div>
</div>

{% endblock %}
